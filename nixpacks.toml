# Dokploy builds from the repository root. Explicitly select Python because its
# requirements live in backend/, then add Node for the frontend build.
providers = ["python"]

[variables]
NIXPACKS_PYTHON_VERSION = "3.12"
NODE_ENV = "production"
STATIC_DIR = "/app/static"
STORAGE_DIR = "/app/data/uploads"
PORT = "8000"
# Keep build logs focused on the build: no interactive prompts, update banners or audit
# summaries, and tolerate slow package-index responses instead of failing the install.
DEBIAN_FRONTEND = "noninteractive"
NPM_CONFIG_AUDIT = "false"
NPM_CONFIG_FUND = "false"
NPM_CONFIG_UPDATE_NOTIFIER = "false"
PIP_DISABLE_PIP_VERSION_CHECK = "1"
PIP_DEFAULT_TIMEOUT = "120"
PIP_RETRIES = "8"

[phases.setup]
nixPkgs = ["...", "nodejs_22"]
aptPkgs = ["...", "tesseract-ocr", "tesseract-ocr-eng", "tesseract-ocr-osd", "libreoffice-writer"]

[phases.install]
dependsOn = ["setup"]
cmds = [
  "node --version && npm --version",
  "python -m venv --copies /opt/venv",
  "/opt/venv/bin/python -m pip install -r backend/requirements.txt",
  "npm ci --include=dev",
]
paths = ["/opt/venv/bin"]

[phases.build]
dependsOn = ["install"]
cmds = [
  "npm run build",
  "mkdir -p /app/static && cp -R frontend/dist/. /app/static/",
  "date -u +%Y-%m-%dT%H:%M:%SZ > /app/BUILD",
]

[start]
cmd = "/opt/venv/bin/python scripts/start-production.py"
