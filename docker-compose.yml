# Local development only. In Dokploy the database is its own service and this file
# is not used — the app there reads DATABASE_URL from the service environment.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-care_india}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    profiles: ["redis"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -ec
      - |
        if [ -z "$$REDIS_PASSWORD" ]; then
          echo "REDIS_PASSWORD must be set before starting the Redis service." >&2
          exit 1
        fi
        exec docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --raw ping 2>/dev/null | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build: .
    environment:
      # Override the complete URL when changing credentials; URL-encode its user/password.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/care_india}
      REDIS_URL: ${REDIS_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      AGENCY_TIMEZONE: ${AGENCY_TIMEZONE:-Asia/Kolkata}
      STATIC_DIR: /app/static
      STORAGE_DIR: /app/data/uploads
      # Content inspection and specialist resume/passport/Aadhaar extraction.
      VERIS_OCR_BASE_URL: ${VERIS_OCR_BASE_URL:-}
      VERIS_OCR_API_KEY: ${VERIS_OCR_API_KEY:-}
      TESSERACT_CMD: ${TESSERACT_CMD:-}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-300}
      OCR_PAGE_TIMEOUT_SECONDS: ${OCR_PAGE_TIMEOUT_SECONDS:-20}
      OCR_DOCUMENT_TIMEOUT_SECONDS: ${OCR_DOCUMENT_TIMEOUT_SECONDS:-600}
      # The supervisor starts a separate worker only when explicitly enabled.
      EMAIL_INGESTION_ENABLED: ${EMAIL_INGESTION_ENABLED:-false}
      EMAIL_POLL_SECONDS: ${EMAIL_POLL_SECONDS:-120}
      IMAP_SERVER: ${IMAP_SERVER:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USERNAME: ${IMAP_USERNAME:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_USE_SSL: ${IMAP_USE_SSL:-true}
      IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
      EMAIL_ACCOUNTS_JSON: ${EMAIL_ACCOUNTS_JSON:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads:
