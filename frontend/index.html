<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/care-india-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/care-india-favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/care-india-favicon-180.png" />
    <title>CRM</title>
    <script>(function(){try{var d=document.documentElement,t=localStorage.getItem('crm-theme');if(t!=='light'&&t!=='dark')t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';d.dataset.theme=t;d.dataset.palette='white'}catch(e){}})()</script>
    <script>
      /* Start the first requests now, before the JavaScript bundle has even downloaded: the server begins working on
         the session + workspace (and the dashboard) while the browser fetches the app. The app takes these over
         (shared/api/client.ts takeEarlyRead); if anything about them is off it simply makes its own requests. */
      (function () {
        try {
          if (!window.fetch) return
          var base = '__CRM_API_BASE__'
          if (base.indexOf('%') > -1) base = ''
          var early = (window.__crmEarly = {})
          var start = function (key, path) {
            var response = fetch(base + '/api' + path, { credentials: 'include' })
            response.catch(function () {})
            early[key] = { path: path, startedAt: Date.now(), response: response }
          }
          start('session', '/auth/session?workspace=true&compact=true')
          var here = location.pathname
          if (here === '/' || here === '') start('dashboard', '/dashboard')
          /* Screen code for this URL, injected at build time; fetched alongside the entry bundle. */
          var chunks = __CRM_CHUNK_TABLE__
          var wanted = chunks[here.replace(/\/+$/, '') || '/'] || []
          for (var i = 0; i < wanted.length; i++) {
            var link = document.createElement('link')
            link.rel = wanted[i].slice(-4) === '.css' ? 'preload' : 'modulepreload'
            if (link.rel === 'preload') link.as = 'style'
            link.href = wanted[i]
            link.crossOrigin = ''
            document.head.appendChild(link)
          }
        } catch (e) {}
      })()
    </script>
    <style>[data-theme="dark"] .pre-splash{background:#0a0a0b!important}[data-theme="dark"] .pre-logo-light{display:none!important}[data-theme="dark"] .pre-logo-dark{display:block!important}[data-theme="dark"] .pre-splash p{color:#a1a1aa!important}</style>
    <link rel="preload" href="/fonts/poppins-medium.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root">
      <div class="pre-splash" role="status" aria-label="Loading" style="display:grid;min-height:100vh;place-items:center;margin:0;font-family:system-ui,sans-serif;background:#fff">
        <div style="display:flex;flex-direction:column;align-items:center">
          <img class="pre-logo-light" src="/brand/care-india-logo-tight.png" alt="Care India Overseas" width="240" height="125" style="display:block;width:240px;height:auto" />
          <img class="pre-logo-dark" src="/brand/care-india-logo-tight-dark.png" alt="Care India Overseas" width="240" height="125" style="display:none;width:240px;height:auto" />
          <p style="margin:18px 0 0;font-size:14px;font-weight:500;color:#64748b">Loading…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
