<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Care India | Recruitment CRM</title>
    <script>(function(){try{var d=document.documentElement,t=localStorage.getItem('crm-theme'),p=localStorage.getItem('crm-palette');if(t!=='light'&&t!=='dark')t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';d.dataset.theme=t;if(p&&p!=='royal'&&/^(white|graphite|violet|emerald)$/.test(p))d.dataset.palette=p}catch(e){}})()</script>
    <script>
      /* Start the first requests now, before the JavaScript bundle has even downloaded: the server begins working on
         the session + workspace (and the dashboard) while the browser fetches the app. The app takes these over
         (shared/api/client.ts takeEarlyRead); if anything about them is off it simply makes its own requests. */
      (function () {
        try {
          if (!window.fetch) return
          var base = '%VITE_API_URL%'
          if (base.indexOf('%') > -1) base = ''
          var early = (window.__crmEarly = {})
          var start = function (key, path) {
            var response = fetch(base + '/api' + path, { credentials: 'include' })
            response.catch(function () {})
            early[key] = { path: path, startedAt: Date.now(), response: response }
          }
          start('session', '/auth/session?workspace=true&compact=true')
          var here = location.pathname
          if (here === '/' || here === '') start('dashboard', '/dashboard')
          /* Screen code for this URL, injected at build time; fetched alongside the entry bundle. */
          var chunks = __CRM_CHUNK_TABLE__
          var wanted = chunks[here.replace(/\/+$/, '') || '/'] || []
          for (var i = 0; i < wanted.length; i++) {
            var link = document.createElement('link')
            link.rel = wanted[i].slice(-4) === '.css' ? 'preload' : 'modulepreload'
            if (link.rel === 'preload') link.as = 'style'
            link.href = wanted[i]
            link.crossOrigin = ''
            document.head.appendChild(link)
          }
        } catch (e) {}
      })()
    </script>
    <link rel="preload" href="/fonts/poppins-medium.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root">
      <div role="status" aria-label="Loading Care India" style="display:grid;min-height:100vh;place-items:center;margin:0;font-family:system-ui,sans-serif;background:#fff">
        <div style="display:flex;flex-direction:column;align-items:center">
          <span style="display:grid;place-items:center;width:56px;height:56px;border-radius:17px;background:#edf2ff"><span style="display:block;width:24px;height:24px;border:3px solid #4169e1;border-radius:6px;transform:rotate(45deg)"></span></span>
          <p style="margin:16px 0 0;font-size:17px;font-weight:600;color:#202d43">Care India</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
